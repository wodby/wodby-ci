name: Wodby Vue Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: wodby/actions/setup-wodby-cli@v1
        with:
          api-key: ${{ secrets.WODBY_API_KEY }}
          app-service-id: ${{ vars.WODBY_APP_SERVICE_ID }}

      - name: Install dependencies
        run: wodby ci run -i wodby/node -- npm ci

      - name: Run tests
        run: wodby ci run -i wodby/node -- npm test

      - name: Build frontend assets
        run: wodby ci run -i wodby/node -- npm run build

      - name: Build image
        run: wodby ci build vue --from dist

      - name: Push image
        run: wodby ci push

      - name: Deploy
        run: wodby ci deploy
