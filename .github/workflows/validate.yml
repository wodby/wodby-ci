name: Validate examples

on:
  pull_request:
  push:
    branches:
      - "2.0"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install YAML parser
        run: python -m pip install -r scripts/requirements.txt

      - name: Validate repository conventions
        run: python scripts/validate_examples.py

      - name: Validate GitHub Actions examples
        run: |
          find . -type f \( \
            -path "./.github/workflows/*.yml" -o \
            -path "./*/github-actions/*.yml" \
          \) -print0 |
            xargs -0 go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check README links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md
          fail: true
