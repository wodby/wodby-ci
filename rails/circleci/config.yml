version: 2.1

orbs:
  wodby: wodby/setup-wodby-cli@1

jobs:
  build:
    machine:
      image: ubuntu-2604:current

    steps:
      - checkout
      - wodby/setup:
          app-service-id: $WODBY_APP_SERVICE_ID
      - run: wodby ci build rails -f Dockerfile
      - run: wodby ci release
      - run: wodby ci deploy
