version: 0.1

workflows:
  main:
    jobs:
      - build

jobs:
  build:
    steps:
      - clone

      - cache_restore:
          path: ~/.composer/cache
          key: 'composer-{{ hash "composer.lock" }}-v1'

      - run: wodby ci init $WODBY_BUILD_ID
      - run: wodby ci run -s php -- composer install --prefer-dist -n --no-ansi

      # Enable these steps when the project builds frontend assets:
      # - run: wodby ci run -i wodby/node:24 -- npm ci
      # - run: wodby ci run -i wodby/node:24 -- npm run build

      - cache_save:
          key: 'composer-{{ hash "composer.lock" }}-v1'
          path: ~/.composer/cache

      - run: wodby ci build php
      - run: wodby ci build nginx
      - run: wodby ci release
      - run: wodby ci deploy
