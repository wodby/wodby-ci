name: Wodby Laravel Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: wodby/actions/setup-wodby-cli@v1
        with:
          api-key: ${{ secrets.WODBY_API_KEY }}
          app-service-id: ${{ vars.WODBY_APP_SERVICE_ID }}

      - name: Install dependencies
        run: wodby ci run -s php -- composer install --prefer-dist -n --no-ansi

      # Enable these steps when the project builds frontend assets:
      # - name: Install frontend dependencies
      #   run: wodby ci run -i wodby/node:24 -- npm ci
      # - name: Build frontend assets
      #   run: wodby ci run -i wodby/node:24 -- npm run build

      - name: Build PHP image
        run: wodby ci build php

      - name: Build Nginx image
        run: wodby ci build nginx

      - name: Release images
        run: wodby ci release

      - name: Deploy
        run: wodby ci deploy
