version: 2.1

orbs:
  wodby: wodby/setup-wodby-cli@1

jobs:
  build:
    machine:
      image: ubuntu-2604:current

    steps:
      - checkout

      - restore_cache:
          keys:
            - uv-v1-{{ checksum "uv.lock" }}
            - uv-v1-

      - wodby/setup:
          app-service-id: $WODBY_APP_SERVICE_ID

      - run:
          name: Run tests
          command: wodby ci run -s django -- uv run --frozen pytest

      - save_cache:
          key: uv-v1-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

      - run: wodby ci build django -f Dockerfile
      - run: wodby ci release
      - run: wodby ci deploy
