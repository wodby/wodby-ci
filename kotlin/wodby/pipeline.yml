version: 0.1

workflows:
  main:
    jobs:
      - build

jobs:
  build:
    steps:
      - clone
      - run: wodby ci init $WODBY_BUILD_ID
      - run: wodby ci run -s kotlin -- sh ./gradlew --no-daemon --console=plain test
      - run: wodby ci build kotlin -f Dockerfile
      - run: wodby ci push
      - run: wodby ci deploy
