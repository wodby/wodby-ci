name: Wodby Static Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-v1-${{ runner.os }}-

      - uses: wodby/actions/setup-wodby-cli@v1
        with:
          api-key: ${{ secrets.WODBY_API_KEY }}
          app-service-id: ${{ vars.WODBY_APP_SERVICE_ID }}

      - name: Install dependencies
        run: wodby ci run -v "$HOME/.npm:/home/node/.npm" -i wodby/node:24 -- npm ci

      - name: Build frontend assets
        run: wodby ci run -v "$HOME/.npm:/home/node/.npm" -i wodby/node:24 -- npm run build

      - name: Build Nginx image
        run: wodby ci build nginx --from dist

      - name: Release image
        run: wodby ci release

      - name: Deploy
        run: wodby ci deploy
