version: 2.1

orbs:
  wodby: wodby/setup-wodby-cli@1

jobs:
  build:
    machine:
      image: ubuntu-2604:current

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - wodby/setup:
          app-service-id: $WODBY_APP_SERVICE_ID

      - run:
          name: Install dependencies
          command: wodby ci run -i wodby/node:24 -- npm ci

      - run:
          name: Build frontend assets
          command: wodby ci run -i wodby/node:24 -- npm run build

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run: wodby ci build nginx --from dist
      - run: wodby ci release
      - run: wodby ci deploy
