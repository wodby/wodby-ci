image:
  name: wodby/wodby-cli:2.0
  pull_policy: always

services:
  - name: docker:dind
    alias: docker

stages:
  - build_and_deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

prod_deploy:
  stage: build_and_deploy
  script:
    - wodby ci init --dind $WODBY_APP_SERVICE_ID
    - wodby ci run -v $CI_PROJECT_DIR/.npm:/home/node/.npm -i wodby/node:24 -- npm ci
    - wodby ci run -v $CI_PROJECT_DIR/.npm:/home/node/.npm -i wodby/node:24 -- npm run build
    - wodby ci build nginx --from dist
    - wodby ci release
    - wodby ci deploy
