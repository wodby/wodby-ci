image:
  name: wodby/wodby-cli:2.0
  pull_policy: always

services:
  - name: docker:dind
    alias: docker

stages:
  - build_and_deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .wodby-ci-cache/npm/

prod_deploy:
  stage: build_and_deploy
  script:
    - wodby ci init --dind $WODBY_APP_SERVICE_ID
    - wodby ci run -i wodby/node -- npm ci
    - wodby ci run -i wodby/node -- npm test
    - wodby ci run -i wodby/node -- npm run build
    # Angular writes the browser build to dist/<project name>/browser.
    - wodby ci build angular --from dist/angular-boilerplate/browser
    - wodby ci push
    - wodby ci deploy
