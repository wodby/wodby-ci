version: 2.1

orbs:
  wodby: wodby/setup-wodby-cli@1

jobs:
  build:
    machine:
      image: ubuntu-2604:current

    steps:
      - checkout

      - wodby/setup:
          app-service-id: $WODBY_APP_SERVICE_ID

      - run:
          name: Run tests
          command: wodby ci run -s java -- sh ./mvnw -B -ntp test

      - run: wodby ci build java -f Dockerfile
      - run: wodby ci push
      - run: wodby ci deploy
