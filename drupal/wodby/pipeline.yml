version: 0.1

workflows:
  main:
    jobs:
      - build

jobs:
  build:
    steps:
      - clone

      - cache_restore:
          path: ~/.composer/cache
          key: 'composer-{{ hash "composer.lock" }}-v1'

      - run: wodby ci init $WODBY_BUILD_ID
      - run: wodby ci run -s php -- composer install --prefer-dist -n --no-ansi

      - cache_save:
          key: 'composer-{{ hash "composer.lock" }}-v1'
          path: ~/.composer/cache

      - run: wodby ci build
      - run: wodby ci release
      - run: wodby ci deploy
