# The following example
# 1. Installs your dependencies from composer.json
# 2. Builds and pushes default images with contents of the current directory (./)
# 3. Deploys build to your app instance

image: wodby/wodby-cli:1.0.5

options:
  docker: true

pipelines:
  default:
    - step:
        caches:
          - docker
          - wodby-composer
        script:
          - wodby ci init --dind $WODBY_INSTANCE_UUID
          - wodby ci run -- composer install --prefer-dist -n --no-dev
          # For frontend dependencies in a subdirectory, pass a path relative to the app root.
          # - wodby ci run -i wodby/node:24 -p path/to/frontend -- npm ci
          - wodby ci build --from ./
          - wodby ci release
          - wodby ci deploy
        services:
          - docker
definitions:
  caches:
    wodby-composer: .wodby-ci-cache/composer
  services:
    docker:
      memory: 2048
