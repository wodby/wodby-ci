name: Wodby PHP Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: ~/.composer
          key: composer-v1-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-v1-${{ runner.os }}-

      - uses: wodby/actions/setup-wodby-cli@v1
        with:
          api-key: ${{ secrets.WODBY_API_KEY }}
          app-service-id: ${{ vars.WODBY_APP_SERVICE_ID }}

      - name: Install dependencies
        run: wodby ci run -v $HOME/.composer:/home/wodby/.composer -- composer install --prefer-dist -n --no-ansi

      - name: Build images
        run: wodby ci build

      - name: Release images
        run: wodby ci release

      - name: Deploy
        run: wodby ci deploy

      # Skip post-deployment scripts:
      # - name: Deploy without post deployment scripts
      #   run: wodby ci deploy --skip-post-deploy
