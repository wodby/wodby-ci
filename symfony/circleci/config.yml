version: 2.1

orbs:
  wodby: wodby/setup-wodby-cli@1

jobs:
  build:
    machine:
      image: ubuntu-2604:current

    steps:
      - checkout

      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
            - composer-v1-

      - wodby/setup:
          app-service-id: $WODBY_APP_SERVICE_ID

      # Development packages stay installed: an environment of type dev runs the same image with APP_ENV=dev.
      - run:
          name: Install dependencies
          command: wodby ci run -s php -- composer install -n --no-ansi --prefer-dist --optimize-autoloader

      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - ~/.composer/cache

      - run: wodby ci build php
      - run: wodby ci build nginx
      - run: wodby ci push
      - run: wodby ci deploy
