name: Wodby Spring Boot Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: wodby/actions/setup-wodby-cli@v1
        with:
          api-key: ${{ secrets.WODBY_API_KEY }}
          app-service-id: ${{ vars.WODBY_APP_SERVICE_ID }}

      - name: Run tests
        run: wodby ci run -s spring-boot -- sh ./mvnw -B -ntp test

      - name: Build image
        run: wodby ci build spring-boot -f Dockerfile

      - name: Push image
        run: wodby ci push

      - name: Deploy
        run: wodby ci deploy
