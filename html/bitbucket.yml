# The following example
# 1. Installs your dependencies from package.json
# 2. Runs build
# 3. Builds and pushes a docker image (HTTP server) with contents of the build (./build)
# 4. Deploys this image to your HTML app instance

image: wodby/wodby-cli:1.0.3

options:
  docker: true

pipelines:
  default:
    - step:
        caches:
          - docker
          - wodby-npm
        script:
          - wodby ci init --dind $WODBY_INSTANCE_UUID
          - wodby ci run -i wodby/node:24 -- npm ci
          - wodby ci run -i wodby/node:24 -- npm run build
          - wodby ci build --from ./build
          - wodby ci release
          - wodby ci deploy
        services:
          - docker
definitions:
  caches:
    wodby-npm: .wodby-ci-cache/npm
  services:
    docker:
      memory: 2048
