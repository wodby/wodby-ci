image:
  name: wodby/wodby-cli:2.0
  pull_policy: always

services:
  - name: docker:dind
    alias: docker

stages:
  - build_and_deploy

prod_deploy:
  stage: build_and_deploy
  script:
    - wodby ci init --dind $WODBY_APP_SERVICE_ID
    # The service image has the runtime only; tests run in the matching SDK image.
    - wodby ci run -i wodby/dotnet:10.0-dev -- dotnet test --solution App.slnx
    - wodby ci build aspnetcore -f Dockerfile
    - wodby ci push
    - wodby ci deploy
