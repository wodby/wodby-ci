name: Wodby Node Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-v1-${{ runner.os }}-

      - uses: wodby/actions/setup-wodby-cli@v1
        with:
          api-key: ${{ secrets.WODBY_API_KEY }}
          app-service-id: PASTE-APP_SERVICE_ID-HERE

      # When you are building node service in your stack.
      # If you're building static HTML and have no node in your stack you can use commands below.
      - name: Install dependencies
        run: wodby ci run -v $HOME/.npm:/home/node/.npm -- npm ci

      ## When you don't have node in your stack just use specific image explicitly.
#      - name: Install dependencies
#        run: wodby ci run -v $HOME/.npm:/home/node/.npm -i wodby/node:24 -- npm ci

## Alternatively, use github, actions to install node modules.
## In this case you won't need actions/cache action.
#      - uses: actions/setup-node@v6
#        with:
#          node-version: 24
#          cache: 'npm'
#      - name: Install node modules
#        run: npm ci

      - name: Build images
        run: wodby ci build

      - name: Release images
        run: wodby ci release

      - name: Deploy
        run: wodby ci deploy

      # Skip post deployment scripts execution:
      # - name: Deploy without post deployment scripts
      #   run: wodby ci deploy --skip-post-deploy
