name: Wodby Rust Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: wodby/actions/setup-wodby-cli@v1
        with:
          api-key: ${{ secrets.WODBY_API_KEY }}
          app-service-id: ${{ vars.WODBY_APP_SERVICE_ID }}

      - name: Check formatting
        run: wodby ci run -s rust -- cargo fmt --check

      - name: Run Clippy
        run: wodby ci run -s rust -- cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: wodby ci run -s rust -- cargo test --locked

      - name: Build image
        run: wodby ci build rust -f Dockerfile

      - name: Push image
        run: wodby ci push

      - name: Deploy
        run: wodby ci deploy
